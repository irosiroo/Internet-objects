<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graph</title><style>body{font-family:system-ui;background:#07080a;color:#eee;max-width:900px;margin:50px auto;padding:20px}.card{border:1px solid #292c33;border-radius:18px;padding:20px;margin:14px 0}pre{white-space:pre-wrap}a{color:#a9c7ff}</style></head><body><h1>Compiled Graph</h1><div id="app">Loading…</div><script>const id=location.pathname.split('/')[2];async function load(){const x=await fetch('/api/graphs/'+id).then(r=>r.json());app.innerHTML='<div class="card"><b>Status: '+x.graph.status+'</b><pre>'+JSON.stringify(x.graph,null,2)+'</pre>'+(x.rootObject?'<a href="'+x.rootObject.url+'">Open root object →</a>':'')+'</div>'}load()</script></body></html>
