<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internet Objects 0.4</title><style>body{font-family:system-ui;background:#07080a;color:#eee;max-width:980px;margin:50px auto;padding:20px}textarea,button{font:inherit;padding:14px;border-radius:12px;border:1px solid #30333a;background:#111318;color:#eee}textarea{width:100%;height:150px;box-sizing:border-box}button{cursor:pointer;background:#fff;color:#000;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #292c33;border-radius:18px;padding:22px;margin-top:18px}.muted{color:#9297a2}a{color:#a9c7ff}pre{white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Internet Objects <span class="muted">0.4</span></h1><p class="muted">Compile intent → activate state → route actors → propagate the next state.</p><div class="card"><textarea id="p" placeholder="I need 4 people to review this sequentially, then the last person decides."></textarea><button onclick="compile()">Compile & Activate</button><pre id="out"></pre></div><div class="grid"><div class="card"><b id="objects">—</b><div class="muted">objects</div></div><div class="card"><b id="visits">—</b><div class="muted">external visits</div></div><div class="card"><b id="conversion">—</b><div class="muted">resolve / visit</div></div></div><p><a href="/dashboard">Open runtime dashboard →</a></p><script>async function stats(){const x=await fetch('/api/stats').then(r=>r.json());objects.textContent=x.objects;visits.textContent=x.visits;conversion.textContent=(x.conversion*100).toFixed(1)+'%'}async function compile(){const prompt=p.value.trim();if(!prompt)return;const r=await fetch('/api/compile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt})});const x=await r.json();if(!x.graphId){out.textContent=JSON.stringify(x,null,2);return}const a=await fetch('/api/graphs/'+x.graphId+'/activate',{method:'POST'}).then(r=>r.json());out.textContent=JSON.stringify({...x,activation:a},null,2);stats()}stats();</script></body></html>
