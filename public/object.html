<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta property="og:type" content="website"><title>Internet Object</title><style>body{font-family:system-ui;background:#07080a;color:#eee;max-width:720px;margin:60px auto;padding:20px}.card{border:1px solid #292c33;border-radius:18px;padding:25px;box-shadow:0 20px 70px #0008}button{display:block;width:100%;margin:11px 0;padding:15px;border-radius:11px;border:1px solid #333;background:#15171c;color:#fff;cursor:pointer}button:hover{background:#20242c}a{color:#a9c7ff}.meta{color:#8e949f;font-size:13px}.share{background:#0e1116;padding:14px;border-radius:12px;word-break:break-all;font-size:13px}hr{border:0;border-top:1px solid #292c33;margin:22px 0}</style></head><body><div class="card"><div class="meta" id="meta">Loading…</div><h1 id="t"></h1><p id="d"></p><div id="c"></div><div id="next"></div><div id="share"></div></div><script>
const id=location.pathname.split('/')[2],params=new URLSearchParams(location.search),actor=params.get('actor');
async function load(){const x=await fetch('/api/objects/'+id).then(r=>r.json());if(!x.object){document.body.innerHTML='<div class="card">Object not found</div>';return}const o=x.object;meta.textContent=`actor ${o.actorId} · state ${o.state} · chain ${o.actorIndex??0}`;t.textContent=o.title;d.textContent=o.description;if(o.state==='resolved'){c.innerHTML='<p>Resolved: <b>'+o.answer+'</b></p>';return}c.innerHTML=o.choices.map(v=>`<button onclick='resolve(${JSON.stringify(v)})'>${v}</button>`).join('');share.innerHTML=o.inviteUrl?`<hr><div class="meta">Send this state to the next actor</div><div class="share">${location.origin+o.inviteUrl}</div>`:''}
async function resolve(answer){const x=await fetch('/api/objects/'+id,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({answer,actorId:actor||'external'})}).then(r=>r.json());if(x.nextObject){next.innerHTML='<hr><p>State resolved. The next actor is now active.</p><div class="share">'+location.origin+x.nextObject.inviteUrl+'</div><p><a href="'+x.nextObject.url+'">Open next actor state →</a></p>'}else if(x.completed){next.innerHTML='<hr><p>Chain completed.</p>'}load()}load();</script></body></html>
