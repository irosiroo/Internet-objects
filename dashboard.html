<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runtime Dashboard</title><style>body{font-family:system-ui;background:#07080a;color:#eee;max-width:1100px;margin:40px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid #292c33;border-radius:16px;padding:18px}.n{font-size:30px}.muted{color:#8f95a0}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px;border-bottom:1px solid #292c33;text-align:left}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><h1>Internet Objects Runtime</h1><div class="grid" id="metrics"></div><div class="card"><h2>Recent objects</h2><table><thead><tr><th>State</th><th>Actor</th><th>Visits</th><th>Chain</th><th>Link</th></tr></thead><tbody id="rows"></tbody></table></div><script>async function load(){const s=await fetch('/api/stats').then(r=>r.json());metrics.innerHTML=[['objects',s.objects],['graphs',s.graphs],['visits',s.visits],['resolutions',s.resolutions],['unique actors',s.uniqueActors],['propagations',s.propagations],['completed',s.completedGraphs],['conversion',(s.conversion*100).toFixed(1)+'%']].map(x=>`<div class="card"><div class="n">${x[1]}</div><div class="muted">${x[0]}</div></div>`).join('');const d=await fetch('/api/objects').then(r=>r.json());rows.innerHTML=d.objects.map(o=>`<tr><td>${o.state}</td><td>${o.actorId||'—'}</td><td>${o.visited}</td><td>${o.actorIndex??'—'}</td><td><a href="${o.url}">open</a></td></tr>`).join('')}load();setInterval(load,5000)</script></body></html>
